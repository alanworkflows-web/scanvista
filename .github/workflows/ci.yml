name: Release Gate CI

on:
  push:
    branches: [ "main", "staging/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Build & Security Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Check & Lint
        # This triggers scripts/check-test-mode.cjs via the lint script
        run: npm run lint

      - name: Run Tests
        # Ensure that no test bypasses are active
        run: npm run test

      - name: Build Application
        run: npm run build
